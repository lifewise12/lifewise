
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeWise | Your Everyday Assistant</title>

<style>
:root {
  --bg: #f6f7fb;
  --panel: #ffffff;
  --text: #17243b;
  --muted: #718096;
  --accent: #e87524;
  --line: #e7eaf0;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
}

.app {
  display: flex;
  height: 100dvh;
  overflow: hidden;
}

.sidebar {
  width: 270px;
  flex-shrink: 0;
  background: #17243b;
  color: white;
  padding: 22px 14px;
  overflow-y: auto;
}

.brand {
  font-size: 26px;
  font-weight: 800;
  padding: 8px 12px 25px;
}

.brand span {
  color: #ff984d;
}

.section {
  color: #a9b5c9;
  font-size: 11px;
  letter-spacing: 1.5px;
  margin: 24px 12px 10px;
}

.nav {
  display: block;
  width: 100%;
  padding: 13px 14px;
  border: 0;
  border-radius: 11px;
  background: transparent;
  color: #dce3ee;
  text-align: left;
  cursor: pointer;
  font-size: 14px;
  margin: 3px 0;
}

.nav:hover,
.nav.active {
  background: #30405a;
  color: white;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.topbar {
  height: 66px;
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 0 24px;
  border-bottom: 1px solid var(--line);
  background: white;
}

.menu {
  background: none;
  border: 0;
  font-size: 23px;
  cursor: pointer;
  color: var(--text);
}

.top-title {
  font-weight: 700;
}

.status {
  margin-left: auto;
  font-size: 12px;
  color: var(--muted);
}

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 30px 20px;
}

.welcome {
  max-width: 690px;
  margin: 10vh auto 0;
  text-align: center;
}

.welcome h1 {
  font-size: clamp(30px, 5vw, 45px);
  margin-bottom: 12px;
}

.welcome p {
  color: var(--muted);
  line-height: 1.7;
}

.messages {
  max-width: 850px;
  margin: auto;
}

.message {
  padding: 17px 20px;
  border-radius: 16px;
  margin: 16px 0;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.message.user {
  background: #e7ecf5;
  margin-left: 12%;
}

.message.assistant {
  background: white;
  border: 1px solid var(--line);
  margin-right: 7%;
}

.composer {
  padding: 16px 20px 24px;
  background: var(--bg);
}

.composer-inner {
  max-width: 850px;
  margin: auto;
  display: flex;
  align-items: flex-end;
  gap: 12px;
  background: white;
  border: 1px solid #dce1e9;
  border-radius: 18px;
  padding: 10px;
  box-shadow: 0 4px 22px #15243b0a;
}

textarea {
  flex: 1;
  resize: none;
  border: 0;
  outline: 0;
  font: inherit;
  padding: 12px;
  min-height: 48px;
  max-height: 180px;
}

.send {
  border: 0;
  border-radius: 12px;
  padding: 14px 20px;
  color: white;
  background: var(--accent);
  cursor: pointer;
  font-weight: 700;
}

.send:disabled {
  opacity: 0.5;
  cursor: wait;
}

.project {
  background: white;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 18px;
  margin: 12px 0;
  cursor: pointer;
}

.project:hover {
  border-color: var(--accent);
}

.project small {
  color: var(--muted);
}

.action {
  padding: 10px 16px;
  background: #17243b;
  color: white;
  border: 0;
  border-radius: 9px;
  cursor: pointer;
}

@media (max-width: 700px) {
  .sidebar {
    position: absolute;
    z-index: 10;
    height: 100%;
    transform: translateX(-100%);
    transition: transform 0.2s;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .topbar {
    padding: 0 15px;
  }

  .status {
    display: none;
  }

  .chat {
    padding: 15px;
  }

  .message.user {
    margin-left: 5%;
  }

  .message.assistant {
    margin-right: 0;
  }

  .composer {
    padding: 10px;
  }
}

@media (min-width: 701px) {
  .sidebar.closed {
    display: none;
  }
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">Life<span>Wise</span></div>

    <button class="nav active" data-category="general">
      Home
    </button>

    <button class="nav" data-category="projects">
      My Projects
    </button>

    <div class="section">LIFEWISE TOOLS</div>

    <button class="nav" data-category="budget">
      Money & Budget
    </button>

    <button class="nav" data-category="financing">
      Financing
    </button>

    <button class="nav" data-category="career">
      Career & Work
    </button>

    <button class="nav" data-category="shopping">
      Shopping Decisions
    </button>

    <button class="nav" data-category="diy">
      DIY & Home
    </button>

    <button class="nav" data-category="planning">
      Planning & Goals
    </button>

    <button class="nav" data-category="everyday">
      Everyday Problems
    </button>
  </aside>

  <main class="main">

    <header class="topbar">
      <button class="menu" id="menuButton" aria-label="Toggle menu">
        ☰
      </button>

      <div class="top-title" id="pageTitle">LifeWise</div>

      <div class="status">Your everyday problem-solving assistant</div>
    </header>

    <section class="chat" id="chatArea">
      <div class="welcome" id="welcome">
        <h1>LifeWise</h1>
        <p>
          Your everyday problem-solving assistant.
          What can I help you figure out today?
        </p>
      </div>

      <div class="messages" id="messages"></div>
    </section>

    <footer class="composer" id="composer">
      <div class="composer-inner">
        <textarea
          id="messageInput"
          placeholder="Ask LifeWise anything..."
          rows="1"
        ></textarea>

        <button class="send" id="sendButton">
          Send
        </button>
      </div>
    </footer>

  </main>
</div>

<script>
const sidebar = document.getElementById("sidebar");
const menuButton = document.getElementById("menuButton");
const pageTitle = document.getElementById("pageTitle");
const chatArea = document.getElementById("chatArea");
const welcome = document.getElementById("welcome");
const messages = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");

let currentCategory = "general";
let currentConversation = null;

const categoryInfo = {
  general: {
    title: "LifeWise",
    prompt: "You are LifeWise, a practical everyday problem-solving assistant. Help the user with their question and ask useful follow-up questions when needed."
  },
  budget: {
    title: "Money & Budget",
    prompt: "You are LifeWise's personal budgeting assistant. Help the user understand income, expenses, bills, savings, and spending. Ask for the information you need naturally, one step at a time. Help create a practical budget based on their real circumstances."
  },
  financing: {
    title: "Financing",
    prompt: "You are LifeWise's financing assistant. Help the user understand financing options, monthly payments, interest rates, loan terms, and affordability. Explain trade-offs clearly and never invent approval terms or guarantee loan approval."
  },
  career: {
    title: "Career & Work",
    prompt: "You are LifeWise's career assistant. Help with career planning, workplace problems, professional communication, resumes, interviews, and career development. Give practical, personalized advice."
  },
  shopping: {
    title: "Shopping Decisions",
    prompt: "You are LifeWise's shopping decision assistant. Help the user compare products, prices, features, quality, and value. Ask what matters most and explain the trade-offs before recommending an option."
  },
  diy: {
    title: "DIY & Home",
    prompt: "You are LifeWise's home improvement assistant. Help with repairs, renovation planning, materials, tools, costs, and project steps. Consider the user's skill level, budget, climate, and safety. Clearly identify when a licensed professional or local code check is needed."
  },
  planning: {
    title: "Planning & Goals",
    prompt: "You are LifeWise's planning assistant. Help the user turn goals into realistic action plans, milestones, and next steps. Keep plans organized and adapt them as circumstances change."
  },
  everyday: {
    title: "Everyday Problems",
    prompt: "You are LifeWise's everyday problem-solving assistant. Help the user work through practical challenges, organize options, and decide what to do next. Be clear, calm, and solution-oriented."
  }
};

function loadConversations() {
  try {
    return JSON.parse(
      localStorage.getItem("lifewise_conversations") || "[]"
    );
  } catch {
    return [];
  }
}

function saveConversations() {
  localStorage.setItem(
    "lifewise_conversations",
    JSON.stringify(conversations)
  );
}

let conversations = loadConversations();

function createConversation(category) {
  const conversation = {
    id: Date.now().toString(),
    category,
    title: categoryInfo[category]?.title || "LifeWise",
    messages: [],
    updatedAt: new Date().toISOString()
  };

  conversations.unshift(conversation);
  saveConversations();

  return conversation;
}

function setActiveNav(category) {
  document.querySelectorAll(".nav").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.category === category
    );
  });
}

function addMessage(role, content) {
  const element = document.createElement("div");

  element.className =
    "message " + (role === "user" ? "user" : "assistant");

  element.textContent = content;
  messages.appendChild(element);

  chatArea.scrollTop = chatArea.scrollHeight;
}

function renderMessages() {
  messages.replaceChildren();

  if (!currentConversation) return;

  currentConversation.messages.forEach(message => {
    addMessage(message.role, message.content);
  });
}

function openCategory(category) {
  currentCategory = category;
  setActiveNav(category);

  welcome.style.display = "none";
  messages.replaceChildren();

  if (category === "projects") {
    renderProjects();
    pageTitle.textContent = "My Projects";
    messageInput.placeholder = "Ask LifeWise anything...";
    sidebar.classList.remove("open");
    return;
  }

  const info = categoryInfo[category] || categoryInfo.general;

  pageTitle.textContent = info.title;
  messageInput.placeholder =
    category === "general"
      ? "Ask LifeWise anything..."
      : "What would you like help with?";

  currentConversation = createConversation(category);

  addMessage(
    "assistant",
    category === "general"
      ? "Hi! I'm LifeWise. What's on your mind today?"
      : "Welcome to " + info.title + ". I'll help you work through this step by step. What would you like to accomplish?"
  );

  currentConversation.messages.push({
    role: "assistant",
    content: messages.lastElementChild.textContent
  });

  saveConversations();
  sidebar.classList.remove("open");
}

function renderProjects() {
  messages.replaceChildren();

  const heading = document.createElement("h2");
  heading.textContent = "My Projects";
  messages.appendChild(heading);

  const description = document.createElement("p");
  description.textContent =
    "Your saved conversations and ongoing work, all in one place.";
  messages.appendChild(description);

  if (!conversations.length) {
    const empty = document.createElement("p");
    empty.textContent =
      "Your conversations will appear here as you start using LifeWise.";
    messages.appendChild(empty);
    return;
  }

  conversations.forEach(conversation => {
    const card = document.createElement("div");
    card.className = "project";

    const title = document.createElement("strong");
    title.textContent =
      conversation.messages.find(m => m.role === "user")?.content
        ?.slice(0, 65) ||
      conversation.title;

    const details = document.createElement("p");
    details.textContent = conversation.title;

    const date = document.createElement("small");
    date.textContent = new Date(
      conversation.updatedAt
    ).toLocaleString();

    card.append(title, details, date);

    card.addEventListener("click", () => {
      currentConversation = conversation;
      currentCategory = conversation.category;
      setActiveNav(currentCategory);
      pageTitle.textContent = conversation.title;
      welcome.style.display = "none";
      renderMessages();
      sidebar.classList.remove("open");
    });

    messages.appendChild(card);
  });
}

async function sendMessage() {
  const text = messageInput.value.trim();

  if (!text || sendButton.disabled) return;

  if (currentCategory === "projects") {
    currentCategory = "general";
    currentConversation = null;
  }

  if (!currentConversation) {
    currentConversation = createConversation(currentCategory);
  }

  welcome.style.display = "none";
  addMessage("user", text);

  currentConversation.messages.push({
    role: "user",
    content: text
  });

  currentConversation.updatedAt = new Date().toISOString();
  saveConversations();

  messageInput.value = "";
  sendButton.disabled = true;
  sendButton.textContent = "...";

  const loading = document.createElement("div");
  loading.className = "message assistant";
  loading.textContent = "LifeWise is thinking...";
  messages.appendChild(loading);

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        input: text,
        category: currentCategory,
        instructions:
          categoryInfo[currentCategory]?.prompt ||
          categoryInfo.general.prompt,
        conversation: currentConversation.messages
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || data.message || "The request failed."
      );
    }

    loading.remove();

    const answer =
      data.output ||
      data.answer ||
      data.reply ||
      data.message ||
      "I received your request, but no answer was returned.";

    addMessage("assistant", answer);

    currentConversation.messages.push({
      role: "assistant",
      content: answer
    });

    currentConversation.updatedAt = new Date().toISOString();
    saveConversations();

  } catch (error) {
    loading.remove();

    addMessage(
      "assistant",
      "I couldn't connect to LifeWise right now. " +
      error.message +
      " Please check the server configuration and try again."
    );
  } finally {
    sendButton.disabled = false;
    sendButton.textContent = "Send";
    messageInput.focus();
  }
}

document.querySelectorAll(".nav").forEach(button => {
  button.addEventListener("click", () => {
    openCategory(button.dataset.category);
  });
});

menuButton.addEventListener("click", () => {
  if (window.innerWidth <= 700) {
    sidebar.classList.toggle("open");
  } else {
    sidebar.classList.toggle("closed");
  }
});

sendButton.addEventListener("click", sendMessage);

messageInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

openCategory("general");
</script>

</body>
</html>
